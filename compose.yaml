services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: product_list
      MYSQL_USER: product_app
      MYSQL_PASSWORD: product_app
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:

